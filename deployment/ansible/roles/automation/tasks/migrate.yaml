---
- name: Check migration source exists
  ansible.builtin.command:
    argv: [/bin/test, -e, "{{ automation_migration.src }}"]
  register: automation_source
  changed_when: false
  failed_when: false

- name: Create state destination parent
  ansible.builtin.file:
    path: "{{ (automation_data_dir ~ '/' ~ automation_migration.dest) | dirname }}"
    state: directory
    mode: "0700"
  when: automation_source.rc == 0

- name: Copy state without replacing current data
  ansible.builtin.copy:
    src: "{{ automation_migration.src }}"
    dest: "{{ automation_data_dir }}/{{ automation_migration.dest }}"
    remote_src: true
    force: false
    mode: "0600"
  when: automation_source.rc == 0
