[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-automation-control-plane"
version = "0.1.0"
description = "Confirmed, stateful workflows for mobile UI automation"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["Jinja2==3.1.6", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
