name: Validate deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ansible-core==2.19.3 ansible-lint==25.9.2
      - run: ansible-galaxy collection install -r deployment/ansible/requirements.yaml
      - run: ansible-playbook -i deployment/ansible/inventory.example.ini deployment/ansible/playbook.yaml --syntax-check
      - run: ansible-lint deployment/ansible/playbook.yaml
  templates:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests
